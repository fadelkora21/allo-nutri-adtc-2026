<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ALLO NUTRI — Feed Formulator</title>
  <style>
    :root{--green:#164b3a;--lime:#d7ef68;--cream:#f5f1e8;--ink:#17211d;--muted:#68736d;--red:#9f2d2d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 system-ui,sans-serif}.top{background:var(--green);color:#fff;padding:28px max(5vw,24px)}.brand{font-size:28px;font-weight:850;letter-spacing:-1px}.tag{color:#cce0d8;max-width:680px}.wrap{max-width:1180px;margin:28px auto;padding:0 20px;display:grid;grid-template-columns:1.15fr .85fr;gap:22px}.card{background:#fff;border:1px solid #dedbd2;border-radius:16px;padding:22px;box-shadow:0 8px 30px #164b3a0c}h2{margin:0 0 18px;font-size:18px}label{font-weight:650;display:block;margin-bottom:6px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}select,input{width:100%;border:1px solid #c8ccc8;border-radius:9px;padding:10px;background:#fff}.ingredient{display:grid;grid-template-columns:28px 1.45fr .8fr .8fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.ingredient small{color:var(--muted)}button{border:0;border-radius:10px;background:var(--lime);color:#183224;font-weight:800;padding:13px 18px;cursor:pointer;margin-top:18px;width:100%}button:hover{filter:brightness(.96)}.error{color:var(--red);margin-top:12px}.hero-result{background:var(--green);color:white;border-radius:13px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:25px;font-weight:800}.muted{color:#cce0d8}.rows{margin-top:14px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee}.nutrients{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.pill{background:#eef5ef;border-radius:9px;padding:10px}.pill b{display:block;font-size:17px}.warning{background:#fff5d7;border-left:4px solid #e0a900;padding:11px;margin-top:12px;border-radius:6px}.advice{background:#edf5f1;padding:14px;border-radius:10px;margin-top:14px}.empty{color:var(--muted);padding:40px 8px;text-align:center}@media(max-width:800px){.wrap{grid-template-columns:1fr}.ingredient{grid-template-columns:25px 1fr .8fr}.available{display:none}}
  </style>
</head>
<body><header class="top"><div class="brand">ALLO NUTRI</div><div class="tag">Formulation locale, équilibrée et au moindre coût pour les petits producteurs de volailles.</div></header>
<main class="wrap"><section class="card"><h2>1. Paramètres et ingrédients disponibles</h2><div class="controls"><div><label for="phase">Phase</label><select id="phase"></select></div><div><label for="total">Quantité totale (kg)</label><input id="total" type="number" value="100" min="1"></div><div><label for="language">Langue de l’explication</label><select id="language"><option value="fr">Français</option><option value="ha">Hausa</option><option value="en">English</option></select></div></div><div class="ingredient"><b></b><b>Ingrédient</b><b>Prix/kg</b><b class="available">Disponible</b></div><div id="ingredients"></div><button id="optimize">Optimiser ma ration</button><div id="error" class="error"></div></section><section class="card"><h2>2. Formule proposée</h2><div id="result" class="empty">Choisissez vos ingrédients et lancez l’optimisation.</div></section></main>
<script>
let catalog;const prices={maize:250,sorghum:240,wheat_bran:180,maize_bran:160,soybean_meal:520,roasted_soy:550,cottonseed_cake:280,palm_kernel_cake:220,fish_meal:900,bone_meal:200,limestone:100,oil:800,dl_methionine:3500,l_lysine:3000};
const fmt=(v,d=2)=>Number(v).toFixed(d);async function init(){catalog=await(await fetch('/api/catalog')).json();phase.innerHTML=Object.entries(catalog.requirements).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');ingredients.innerHTML=catalog.ingredients.map((x,i)=>`<div class="ingredient"><input type="checkbox" data-key="${x.key}" ${['maize','soybean_meal','fish_meal','limestone','oil','dl_methionine','l_lysine'].includes(x.key)?'checked':''}><div>${x.name}<br><small>Max. selon phase</small></div><input class="price" type="number" value="${prices[x.key]||250}" min="0"><input class="available" type="number" value="100" min="0"></div>`).join('')}
optimize.onclick=async()=>{error.textContent='';result.innerHTML='<div class="empty">Calcul en cours…</div>';const items=[...document.querySelectorAll('.ingredient input[type=checkbox]:checked')].map(c=>{const row=c.closest('.ingredient');return{key:c.dataset.key,price:+row.querySelector('.price').value,available:+row.querySelector('.available').value}});const res=await fetch('/api/formulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phase:phase.value,total_kg:+total.value,language:language.value,ingredients:items})});const d=await res.json();if(!res.ok){result.innerHTML='<div class="empty">La formulation n’a pas abouti.</div>';error.textContent=d.error;return}result.innerHTML=`<div class="hero-result"><div><span class="muted">Coût total</span><div class="big">${fmt(d.cost)} FCFA</div></div><div><span class="muted">Coût/kg</span><div class="big">${fmt(d.cost_per_kg)} FCFA</div></div></div><div class="rows">${d.quantities.map(x=>`<div class="row"><span>${x.name}</span><b>${fmt(x.kg)} kg <small>(${fmt(x.percent)} %)</small></b></div>`).join('')}</div><div class="nutrients"><div class="pill">Énergie<b>${fmt(d.nutrients.me,0)} kcal/kg</b></div><div class="pill">Protéines<b>${fmt(d.nutrients.cp)} %</b></div><div class="pill">Calcium<b>${fmt(d.nutrients.ca)} %</b></div><div class="pill">P disponible<b>${fmt(d.nutrients.avp)} %</b></div><div class="pill">Lysine<b>${fmt(d.nutrients.lys)} %</b></div><div class="pill">Fibres<b>${fmt(d.nutrients.fiber)} %</b></div></div><div class="advice"><b>Explication ALLO NUTRI</b><br>${d.advice}</div>${d.warnings.map(w=>`<div class="warning">${w}</div>`).join('')}`};init();
</script></body></html>
